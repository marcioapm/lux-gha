name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt, go vet, the licence copy check and every Go test.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make lint
        run: make lint

      # One race-enabled verbose run. No test has a reason to skip in CI: a
      # skip is a broken setup. shell: bash runs with -eo pipefail, so a test
      # failure fails the step through tee.
      - name: go test, none skipped
        shell: bash
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee test.log
          ! grep -E -- '^\s*--- SKIP' test.log

      # The release tarballs, so a broken dist.sh fails here and not on a tag.
      - name: make dist
        run: |
          make dist VERSION=v0.0.0
          rm -rf dist

  # The runner image's shell: lint, parse, and the entrypoint lifecycle test.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck images/runner/*.sh scripts/*.sh scripts/pre-commit

      # An expression inside run: is pasted into the script unescaped (a tag name may
      # hold ; | ` $( ' "): pass such values through env: instead.
      # A line heuristic: a key-shaped line inside a run: block slips through, and
      # an expression in a with:/env: block scalar or a comment fails it.
      - name: No expressions inside run
        run: |
          awk '/\$\{\{/ && (!/^[[:space:]]*(- )?[A-Za-z0-9_-]+:[[:space:]]/ || /^[[:space:]]*(- )?run:/) { print FILENAME ":" FNR ": " $0; bad = 1 } END { exit bad }' .github/workflows/*.yml

      - name: sh -n
        run: |
          for f in images/runner/*.sh scripts/check-license.sh scripts/pre-commit; do
            sh -n "$f"
          done
          bash -n scripts/dist.sh

      - name: make entrypoint-test
        run: make entrypoint-test

  # Builds the runner image for each architecture on a runner of that
  # architecture and runs the unprivileged smoke test against it. Always run:
  # the image pins apt package versions that Docker's repository can drop, and
  # this catches that before a tag does.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: smoke.sh (builds the image, then tests it)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: images/runner/smoke.sh

  # The release's publish scripts, push-by-digest.sh and image-index.sh,
  # against a registry on localhost:5000 (publish_test.sh), so a broken
  # script fails here and not on a tag. arm64 only: the scripts take the
  # platform as input, and this job builds once more as the release job does.
  publish:
    runs-on: ubuntu-24.04-arm
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      # docker-container, as in release.yml: push-by-digest needs it. The
      # BuildKit container shares the host's network so that localhost:5000
      # is the registry service; BuildKit speaks plain HTTP to localhost.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: smoke.sh --keep
        env:
          PLATFORM: linux/arm64
          TAG: lux-gha-runner:tested
        run: images/runner/smoke.sh --keep

      - name: publish_test.sh
        env:
          REPO: localhost:5000/lux-gha-runner
          PLATFORM: linux/arm64
          TAG: lux-gha-runner:tested
        run: images/runner/publish_test.sh
