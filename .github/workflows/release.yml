name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Tests, then the binary tarballs and SHA256SUMS as a GitHub release.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make test
        run: make test

      # The tag goes through env only: dist.sh rejects anything but vX.Y.Z.
      - name: make dist
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The runner image, one job per architecture on a runner of that
  # architecture: smoke.sh builds and tests it, then the same builder pushes
  # it untagged, by digest. The rebuild for the push is served from that
  # builder's cache; the job fails unless the pushed image's layers and
  # runtime config equal those of the tested image.
  image:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        # GHCR repository names must be lowercase.
        run: echo "repo=ghcr.io/${OWNER,,}/lux-gha-runner" >>"$GITHUB_OUTPUT"

      # A docker-container builder: it can push by digest, and its cache
      # serves the push build from the layers smoke.sh tested.
      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: lux-gha-runner:tested
        run: images/runner/smoke.sh --keep

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        env:
          REPO: ${{ steps.name.outputs.repo }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          meta="$RUNNER_TEMP/push.json"
          # No provenance or SBOM: the index then holds exactly one image
          # manifest per architecture.
          docker buildx build --platform "$PLATFORM" --provenance=false --sbom=false \
            --output "type=image,name=$REPO,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true" \
            --metadata-file "$meta" -f images/runner/Containerfile images/runner
          digest=$(jq -r '."containerimage.digest"' "$meta")
          case $digest in sha256:*) ;; *) echo "no digest in $meta" >&2; exit 1 ;; esac
          tested=$(docker image inspect lux-gha-runner:tested | jq -S '.[0] | {
            platform: "\(.Os)/\(.Architecture)", layers: .RootFS.Layers,
            entrypoint: .Config.Entrypoint, env: .Config.Env, user: .Config.User,
            workdir: .Config.WorkingDir, labels: .Config.Labels}')
          pushed=$(docker buildx imagetools inspect "$REPO@$digest" --format '{{json .Image}}' | jq -S '{
            platform: "\(.os)/\(.architecture)", layers: .rootfs.diff_ids,
            entrypoint: .config.Entrypoint, env: .config.Env, user: .config.User,
            workdir: .config.WorkingDir, labels: .config.Labels}')
          if [ "$tested" != "$pushed" ]; then
            echo "pushed $REPO@$digest differs from the smoke-tested image" >&2
            diff <(echo "$tested") <(echo "$pushed") >&2 || true
            exit 1
          fi
          echo "pushed $REPO@$digest ($PLATFORM), layers and config match the tested image"
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$digest" >"$RUNNER_TEMP/digest/$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # The release tag as an image index over the per-architecture digests.
  image-index:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "repo=ghcr.io/${OWNER,,}/lux-gha-runner" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/lux-gha-runner:$TAG" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the index and record its digest
        env:
          REPO: ${{ steps.name.outputs.repo }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          arm64=$(cat "$RUNNER_TEMP/digest/arm64")
          amd64=$(cat "$RUNNER_TEMP/digest/amd64")
          docker buildx imagetools create -t "$IMAGE" "$REPO@$arm64" "$REPO@$amd64"
          # Read back from the registry: the index digest a route pins; a Lux
          # host pulls its own architecture's manifest from it.
          raw=$(docker buildx imagetools inspect "$IMAGE" --raw)
          platforms=$(echo "$raw" | jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)=\(.digest)"] | sort | join(" ")')
          want="linux/amd64=$amd64 linux/arm64=$arm64"
          [ "$platforms" = "$want" ] || { echo "index holds $platforms, want $want" >&2; exit 1; }
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          ref="$REPO@$digest"
          {
            echo "### Runner image"
            echo
            echo "Pin routes to the digest (an index: linux/arm64 and linux/amd64):"
            echo
            echo '```'
            echo "$ref"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pushed $ref ($platforms)"
