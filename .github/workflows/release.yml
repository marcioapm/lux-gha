name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests, then the binary tarballs and SHA256SUMS as a GitHub release.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make test
        run: make test

      # The tag goes through env only: dist.sh rejects anything but vX.Y.Z.
      - name: make dist
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The runner image, one job per architecture on a runner of that
  # architecture: smoke.sh builds and tests it, then the same builder pushes
  # it untagged, by digest (push-by-digest.sh). The rebuild for the push is
  # served from that builder's cache; the job fails unless the pushed image's
  # platform, layers and runtime config fields equal those of the tested image.
  image:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
      TAG: lux-gha-runner:tested
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        # GHCR repository names must be lowercase.
        run: echo "repo=ghcr.io/${OWNER,,}/lux-gha-runner" >>"$GITHUB_OUTPUT"

      # A docker-container builder: it can push by digest, and its cache
      # serves the push build from the layers smoke.sh tested.
      - uses: docker/setup-buildx-action@v3

      # rootless dockerd in smoke.sh --privileged creates a user namespace as
      # uid 1000 in an unconfined (privileged) container. Ubuntu 24.04's
      # AppArmor denies that to unconfined processes while this sysctl is 1.
      # Kernels without the key have no such restriction.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build and smoke-test
        run: images/runner/smoke.sh --privileged --keep

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI's publish job runs the same script against a local registry.
      - name: Push by digest
        env:
          REPO: ${{ steps.name.outputs.repo }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          OUT="$RUNNER_TEMP/digest/$ARCH" images/runner/push-by-digest.sh

      # Kept 7 days and overwritable, so "re-run failed jobs" works on a
      # later day and a re-run image job replaces its digest.
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The release tag as an image index over the per-architecture digests
  # (image-index.sh: checked with --dry-run before the tag is pushed).
  image-index:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo=ghcr.io/${OWNER,,}/lux-gha-runner" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      # For images/runner/image-index.sh.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Lux host pulls its own architecture's manifest from the index digest.
      - name: Create the index and record its digest
        env:
          REPO: ${{ steps.name.outputs.repo }}
          IMAGE: ${{ steps.name.outputs.repo }}:${{ github.ref_name }}
        run: |
          DIGESTS="$RUNNER_TEMP/digest" PLATFORMS="linux/arm64 linux/amd64" OUT="$RUNNER_TEMP/ref" \
            images/runner/image-index.sh
          ref=$(cat "$RUNNER_TEMP/ref")
          {
            echo "### Runner image"
            echo
            echo "Pin routes to the digest (an index: linux/arm64 and linux/amd64):"
            echo
            echo '```'
            echo "$ref"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
